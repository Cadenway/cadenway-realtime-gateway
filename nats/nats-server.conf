# NATS server of compose.dev.yaml and of the integration tests (test/realtime-gateway.int-spec.ts):
# JetStream, and the two users of cadenway-ops compose/nats/nats-server.conf this gateway meets.
#
# - `realtime-gateway` has the permissions cadenway-ops gives it, copied as they are: it publishes
#   no event, may read the stream information of EVENTS and create, read and acknowledge its own
#   consumers on it, and receives its replies under its own inbox prefix only,
#   `_INBOX.realtime-gateway.>`. A client left on the default `_INBOX.>` prefix is refused its
#   first request, as on every environment.
# - `admin` creates the streams, which no backend may do: the `nats-streams` service of
#   compose.dev.yaml, and the set-up of the tests.
#
# Passwords come from the environment of the container. The server reads `$NAME` as the variable
# NAME only outside quotes: the `$JS...` subjects below are quoted and literal. Letters and digits
# starting with a letter: the server parses the value as configuration.
#
# Keep the `realtime-gateway` entry in step with cadenway-ops when its permissions change there.

port: 4222
http_port: 8222

jetstream {
  store_dir: /data
}

authorization {
  users = [
    {
      user: admin
      password: $NATS_ADMIN_PASSWORD
      permissions: { publish: ">", subscribe: ">" }
    }

    # Relays events to the sockets and emits nothing.
    {
      user: "realtime-gateway"
      password: $REALTIME_GATEWAY_NATS_PASSWORD
      permissions: {
        publish: {
          allow: [
            "$JS.API.INFO", "$JS.API.STREAM.NAMES", "$JS.API.STREAM.INFO.EVENTS",
            "$JS.API.CONSUMER.CREATE.EVENTS.realtime-gateway__relay-session-revoked.evt.session.revoked.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.realtime-gateway__relay-session-revoked",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.realtime-gateway__relay-session-revoked",
            "$JS.ACK.EVENTS.realtime-gateway__relay-session-revoked.>",
            "$JS.API.CONSUMER.CREATE.EVENTS.realtime-gateway__relay-session-organization-changed.evt.session.organization-changed.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.realtime-gateway__relay-session-organization-changed",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.realtime-gateway__relay-session-organization-changed",
            "$JS.ACK.EVENTS.realtime-gateway__relay-session-organization-changed.>",
            "$JS.API.CONSUMER.CREATE.EVENTS.realtime-gateway__relay-member-role-changed.evt.member.role-changed.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.realtime-gateway__relay-member-role-changed",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.realtime-gateway__relay-member-role-changed",
            "$JS.ACK.EVENTS.realtime-gateway__relay-member-role-changed.>",
            "$JS.API.CONSUMER.CREATE.EVENTS.realtime-gateway__relay-member-removed.evt.member.removed.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.realtime-gateway__relay-member-removed",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.realtime-gateway__relay-member-removed",
            "$JS.ACK.EVENTS.realtime-gateway__relay-member-removed.>",
            "$JS.API.CONSUMER.CREATE.EVENTS.realtime-gateway__relay-space-updated.evt.space.updated.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.realtime-gateway__relay-space-updated",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.realtime-gateway__relay-space-updated",
            "$JS.ACK.EVENTS.realtime-gateway__relay-space-updated.>",
            "$JS.API.CONSUMER.CREATE.EVENTS.realtime-gateway__relay-space-access-changed.evt.space.access-changed.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.realtime-gateway__relay-space-access-changed",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.realtime-gateway__relay-space-access-changed",
            "$JS.ACK.EVENTS.realtime-gateway__relay-space-access-changed.>",
            "$JS.API.CONSUMER.CREATE.EVENTS.realtime-gateway__relay-space-access-republished.evt.space.access-republished.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.realtime-gateway__relay-space-access-republished",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.realtime-gateway__relay-space-access-republished",
            "$JS.ACK.EVENTS.realtime-gateway__relay-space-access-republished.>",
            "$JS.API.CONSUMER.CREATE.EVENTS.realtime-gateway__relay-space-deleted.evt.space.deleted.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.realtime-gateway__relay-space-deleted",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.realtime-gateway__relay-space-deleted",
            "$JS.ACK.EVENTS.realtime-gateway__relay-space-deleted.>",
            "$JS.API.CONSUMER.CREATE.EVENTS.realtime-gateway__relay-list-access-changed.evt.list.access-changed.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.realtime-gateway__relay-list-access-changed",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.realtime-gateway__relay-list-access-changed",
            "$JS.ACK.EVENTS.realtime-gateway__relay-list-access-changed.>",
            "$JS.API.CONSUMER.CREATE.EVENTS.realtime-gateway__relay-list-deleted.evt.list.deleted.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.realtime-gateway__relay-list-deleted",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.realtime-gateway__relay-list-deleted",
            "$JS.ACK.EVENTS.realtime-gateway__relay-list-deleted.>",
            "$JS.API.CONSUMER.CREATE.EVENTS.realtime-gateway__relay-task-updated.evt.task.updated.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.realtime-gateway__relay-task-updated",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.realtime-gateway__relay-task-updated",
            "$JS.ACK.EVENTS.realtime-gateway__relay-task-updated.>",
            "$JS.API.CONSUMER.CREATE.EVENTS.realtime-gateway__relay-task-status-changed.evt.task.status-changed.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.realtime-gateway__relay-task-status-changed",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.realtime-gateway__relay-task-status-changed",
            "$JS.ACK.EVENTS.realtime-gateway__relay-task-status-changed.>",
            "$JS.API.CONSUMER.CREATE.EVENTS.realtime-gateway__relay-task-trashed.evt.task.trashed.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.realtime-gateway__relay-task-trashed",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.realtime-gateway__relay-task-trashed",
            "$JS.ACK.EVENTS.realtime-gateway__relay-task-trashed.>",
            "$JS.API.CONSUMER.CREATE.EVENTS.realtime-gateway__relay-task-purged.evt.task.purged.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.realtime-gateway__relay-task-purged",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.realtime-gateway__relay-task-purged",
            "$JS.ACK.EVENTS.realtime-gateway__relay-task-purged.>",
            "$JS.API.CONSUMER.CREATE.EVENTS.realtime-gateway__relay-comment-created.evt.comment.created.v1",
            "$JS.API.CONSUMER.INFO.EVENTS.realtime-gateway__relay-comment-created",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.realtime-gateway__relay-comment-created",
            "$JS.ACK.EVENTS.realtime-gateway__relay-comment-created.>",
          ]
        }
        subscribe: { allow: ["_INBOX.realtime-gateway.>"] }
      }
    }
  ]
}
