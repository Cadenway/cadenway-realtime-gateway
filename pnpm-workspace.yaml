# pnpm settings for this repository. Registry and auth lines stay in .npmrc.

# Supply chain: a version becomes installable two days after its release (2880 minutes, the delay
# Renovate applies too), and a package whose trust evidence (provenance, trusted publisher) is weaker
# than in an earlier version is refused.
minimumReleaseAge: 2880
trustPolicy: no-downgrade

# Install scripts are reviewed one by one: pnpm refuses an install that would skip an unlisted one.
# esbuild ships its binary as an optional dependency, so its postinstall is not needed.
allowBuilds:
  esbuild: false
